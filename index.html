const GOAL = 60;               // секунд до Арины
const box = document.getElementById('box');
const gc = document.getElementById('g'), g = gc.getContext('2d');
const tc = document.getElementById('t'), tx = tc.getContext('2d');
let W=320, H=180, GY=152, S=1, DPR=1;

const img = {};
let loaded = 0; const keys = Object.keys(SPR);
keys.forEach(k=>{ const i=new Image(); i.onload=()=>{ if(++loaded===keys.length) start(); }; i.src=SPR[k]; img[k.replace('_b64','')]=i; });

function layout(){
  const vw = innerWidth, vh = innerHeight, a = vw/vh;
  if (a >= 1.2){ H = 180; W = Math.max(240, Math.min(400, Math.round(180*a))); }
  else { W = 240; H = Math.max(180, Math.min(560, Math.round(240/a))); }
  S = Math.min(vw/W, vh/H); DPR = window.devicePixelRatio||1;
  box.style.width = (W*S)+'px'; box.style.height = (H*S)+'px';
  gc.width = W; gc.height = H;
  tc.width = Math.round(W*S*DPR); tc.height = Math.round(H*S*DPR);
  GY = H - Math.max(28, Math.round(H*0.22));
}
addEventListener('resize', layout); layout();

let AC=null, muted=false;
try{ muted = localStorage.getItem('yr_mute')==='1'; }catch(e){}
const muteBtn=document.getElementById('mute'); muteBtn.textContent = muted?'🔇':'🔊';
muteBtn.addEventListener('pointerdown',e=>{ e.stopPropagation(); muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; try{ document.getElementById('bgm').muted=muted; }catch(e){} try{localStorage.setItem('yr_mute',muted?'1':'0')}catch(e){} });
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f1,f2,dur,type='square',vol=0.08,delay=0){
  if(muted) return; const a=ac(); if(!a) return; const t0=a.currentTime+delay;
  const o=a.createOscillator(), v=a.createGain(); o.type=type;
  o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
  v.gain.setValueAtTime(vol,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(v); v.connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
}

  hit(){ tone(300,60,0.35,'sawtooth',0.1); tone(900,100,0.15,'square',0.05); },

};

const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(n){ const v=Math.sin(n*127.1+311.7)*43758.5453; return v-Math.floor(v); }
function hex(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function mix(c1,c2,t){ const a=hex(c1),b=hex(c2); return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')'; }
function R(x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),w,h); }

const FONT='"Press Start 2P", monospace';
function T(str,gx,gy,size,color='#fff',align='center',shadow='#000'){
  const k=S*DPR; tx.font=`${Math.round(size*k)}px ${FONT}`; tx.textAlign=align; tx.textBaseline='top';
  if(shadow){ tx.fillStyle=shadow; tx.fillText(str,Math.round(gx*k+k),Math.round(gy*k+k)); }
  tx.fillStyle=color; tx.fillText(str,Math.round(gx*k),Math.round(gy*k));
}
function wrap(str,size,maxW){ const k=S*DPR; tx.font=`${Math.round(size*k)}px ${FONT}`;
  const words=str.split(' '), lines=[]; let cur='';
  words.forEach(w=>{ const t=cur?cur+' '+w:w; if(tx.measureText(t).width/k>maxW && cur){ lines.push(cur); cur=w; } else cur=t; });
  if(cur) lines.push(cur); return lines; }
function bubble(str,gx,gy,color='#1d1b24'){
  const size=6, k=S*DPR, maxW=Math.min(150,W*0.62), lines=wrap(str,size,maxW);
  tx.font=`${Math.round(size*k)}px ${FONT}`;
  const tw=Math.max(...lines.map(l=>tx.measureText(l).width/k)), lh=size+3, bw=tw+10, bh=lines.length*lh+7;
  let bx=clamp(gx-bw/2,3,W-bw-3), by=gy-bh-5;
  const r=(x,y,w,h,c)=>{ tx.fillStyle=c; tx.fillRect(Math.round(x*k),Math.round(y*k),Math.round(w*k),Math.round(h*k)); };
  r(bx+1,by,bw-2,bh,'#1d1b24'); r(bx,by+1,bw,bh-2,'#1d1b24');
  r(bx+1,by+1,bw-2,bh-2,'#fffdf5');
  r(gx-2,by+bh-1,5,2,'#fffdf5'); r(gx-1,by+bh+1,3,2,'#fffdf5'); r(gx,by+bh+3,1,2,'#1d1b24');
  lines.forEach((l,i)=>T(l,bx+5,by+4+i*lh,size,color,'left',null));
}
function panel(lines,y0){ // lines: [text,size,color]
  const k=S*DPR; let hgt=10; lines.forEach(l=>hgt+= (l[1]||7)+5);
  const pw=Math.min(W-16,230), px=(W-pw)/2, py=y0??(H-hgt)/2;
  tx.fillStyle='rgba(18,15,31,0.86)'; tx.fillRect(px*k,py*k,pw*k,hgt*k);
  tx.strokeStyle='#ffd59a'; tx.lineWidth=Math.max(1,k); tx.strokeRect(px*k+k/2,py*k+k/2,pw*k-k,hgt*k-k);
  let y=py+7; lines.forEach(([s,size=7,c='#fff'])=>{ const ls=wrap(s,size,pw-14); ls.forEach(l=>{ T(l,W/2,y,size,c); y+=size+4; }); y+=1; });
}

function onTap(){
  const now=performance.now(); if(now-lastTap<120) return; lastTap=now;
  if(state==='title'){ sfx.blip(); go('intro'); }
  else if(state==='intro'){ if(t<14.6){ t=14.6; sfx.blip(); } else { sfx.blip(); resetRun(); go('run'); pressQueued=0; } }
  else if(state==='lose' && t>0.8){ sfx.blip(); resetRun(); go('run'); pressQueued=0; }
  else if(state==='win' && t>9){ sfx.blip(); go('title'); }
}

function updateRun(f,dt){
  runT+=dt; speed=speedAt(runT); scroll+=speed*f;
  // прыжок
  const buffered = pressQueued && performance.now()-pressQueued<130;
  if(buffered && P.h<=0.01){ P.vy=7.6; P.air=true; pressQueued=0; sfx.jump(); haptic('jump'); }
  if(P.air){ if(!holding && P.vy>3) P.vy=3; P.vy-=0.42*f; P.h+=P.vy*f; if(P.h<=0){ P.h=0; P.vy=0; P.air=false; } }
  P.ph+=speed*f*0.09; P.frame=Math.floor(P.ph);
  // собаки
  if(runT<GOAL-6){ nextSpawn-=dt; if(nextSpawn<=0){
      const extra=Math.random()*0.4, pack=runT>25&&Math.random()<0.18;
      dogs.push({x:W+8,extra,kind:1+Math.floor(Math.random()*3),frame:0,ph:0,open:false,barked:false});
      if(pack) dogs.push({x:W+8+36,extra,kind:1+Math.floor(Math.random()*3),frame:0,ph:0,open:false,barked:false});
      const v=(speed+extra)*60, minGap=(speed*40+(pack?70:34))/v; const span=lerp(1.6,0.8,clamp(runT/55,0,1));
      nextSpawn=minGap+Math.random()*span; } }
  dogs.forEach(d=>{ d.x-=(speed+d.extra)*f; d.ph+=f*0.25; d.frame=Math.floor(d.ph); d.open=(Math.floor(d.ph/3)%2===0)&&d.x<W*0.7;
    if(!d.barked&&d.x<W-20){ d.barked=true; if(Math.random()<0.5) sfx.bark(); } });
  dogs=dogs.filter(d=>d.x>-50);
  // столкновения (немного прощаем)
  const px1=P.x-5, px2=P.x+5, py=P.h;
  for(const d of dogs){ const dx1=d.x+3, dx2=d.x+36, dh=21; if(px2>dx1&&px1<dx2&&py<dh){ lose(); return; } }
  if(runT>=GOAL){ go('win'); arinaX=W+24; sfx.win(); haptic('win'); }
}
function lose(){ sfx.hit(); haptic('hit'); shake=10; const sc=Math.floor(runT); if(sc>best){ best=sc; try{localStorage.setItem('yr_best',best)}catch(e){} } go('lose'); }

function drawHUD(){
  const bx=26, bw=W-52, by=12, p=clamp(runT/GOAL,0,1);
  R(bx-1,by-1,bw+2,6,'#1d1b24'); R(bx,by,bw,4,'#4a4060'); R(bx,by,Math.round(bw*p),4,'#ff7a93'); R(bx,by,Math.round(bw*p),1,'#ffb3c1');
  g.drawImage(img.yarik,bx+bw*p-7,by-6,14,16); g.drawImage(img.arina,bx+bw-5,by-6,14,16);
  const left=Math.max(0,Math.ceil(GOAL-runT)), m=Math.floor(left/60), s=String(left%60).padStart(2,'0');
  T(`${m}:${s}`,W/2,by+8,7,'#fff');
  if(best) T(`рекорд ${best}с`,4,4,4,'#ffffffbb','left');
}
function drawRunScene(p){
  drawBG(p);
  dogs.forEach(drawDog);
  if(arinaX!==null) drawArina(arinaX,0,0,false,-1);
  drawYarik(P.x,P.h,P.frame,P.air,1,state==='lose');
}
function runLabels(){
  T('ЯРИК',P.x,GY-P.h-60,4,'#cfe0ff');
  dogs.forEach(d=>{ if(d.open&&d.x>P.x+20&&Math.floor(d.ph/6)%2===0) T('Р-р-р!',d.x+12,GY-40,4,'#ff6b6b'); });
}

// ---------- финал ----------
let winY0;
function updateWin(f,dt){
  if(t<dt*1.5) winY0=P.x;
  const target=W*0.66;
  if(arinaX>target){ const k=clamp((arinaX-target)/90,0.12,1); speed=Math.max(0.6,speed*k); scroll+=speed*f; arinaX-=speed*f; dogs.forEach(d=>d.x-=(speed+d.extra)*f); P.ph+=speed*f*0.09; }
  else { arinaX=target; speed=0; if(P.x<arinaX-(t>6.2?18:32)){ P.x+=1.3*f; P.ph+=0.12*f; } }
  P.frame=Math.floor(P.ph);
  if(P.air||P.h>0){ P.vy-=0.42*f; P.h=Math.max(0,P.h+P.vy*f); if(P.h===0){P.air=false;P.vy=0;} }
  if(t>6.2 && Math.random()<0.15*f) hearts.push({x:arinaX-8+Math.random()*12,y:GY-55,v:0.3+Math.random()*0.4,s:1+Math.floor(Math.random()*2)});
  hearts.forEach(h=>{ h.y-=h.v*f; h.x+=Math.sin(h.y*0.1)*0.2; }); hearts=hearts.filter(h=>h.y>-10);
}

// ---------- цикл ----------
function frame(now){
  requestAnimationFrame(frame);
  if(!last) last=now; let dt=Math.min(0.05,(now-last)/1000); last=now; const f=dt*60; t+=dt;
  if(document.hidden) return;
  g.setTransform(1,0,0,1,0,0); g.imageSmoothingEnabled=false; tx.imageSmoothingEnabled=false;
  if(shake>0){ shake-=f; g.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*4)); }
  tx.clearRect(0,0,tc.width,tc.height);

  if(state==='title'){
    scroll+=0.6*f; drawBG(0.1);
    const cx=W/2, fy=Math.max(48,(GY-62)/2+22), k=S*DPR;
    tx.drawImage(img.yarikBig,(cx-60)*k,fy*k,50*k,58*k); tx.drawImage(img.arinaBig,(cx+10)*k,fy*k,50*k,58*k);
    heart(cx-7,fy+22+Math.sin(t*3)*3,2);
    T('ЯРИК',W/2,H*0.08-2,11,'#ffd59a'); T('бежит к',W/2,H*0.08+12,6,'#fff'); T('АРИНЕ',W/2,H*0.08+21,11,'#ffb3c1');
    T('ЯРИК',cx-35,fy+61,5,'#cfe0ff'); T('АРИНА',cx+35,fy+61,5,'#ffd0dc');
    if(Math.floor(t*2)%2===0) T('ТАП, ЧТОБЫ НАЧАТЬ',W/2,GY+10,6,'#fff');
  }
  else if(state==='intro'){ tx.imageSmoothingEnabled=false; drawIntro(); }
  else if(state==='run'){ updateRun(f,dt); if(state==='run'){ drawRunScene(runT/GOAL); runLabels(); drawHUD(); } else { drawRunScene(runT/GOAL); drawHUD(); } }
  else if(state==='lose'){
    drawRunScene(runT/GOAL); drawHUD();
    bubble('АЙ!!',P.x+4,GY-P.h-52,'#c4142c');
    if(t>0.5) panel([['СОБАКА УКУСИЛА!',8,'#ff8a8a'],[`Пробежал ${Math.floor(runT)} с из ${GOAL}`,6,'#fff'],[`Рекорд: ${best} с`,5,'#ffd59a'],['Тап — ещё раз',7,'#7dff9a']]);
  }
  else if(state==='win'){
    updateWin(f,dt); drawBG(1); dogs.forEach(drawDog); drawArina(arinaX,0,0,false,-1);
    drawYarik(P.x,P.h,P.frame,P.air,1);
    hearts.forEach(h=>heart(h.x,h.y,h.s));
    if(t<6.2){ T('ЯРИК',P.x,GY+6,5,'#cfe0ff'); T('АРИНА',arinaX,GY+6,5,'#ffd0dc'); }
    if(t>2.4&&t<4.4) bubble('Арина, прости меня! Я был неправ',P.x+4,GY-52,'#1d3b8a');
    if(t>4.4&&t<6.4) bubble('Ладно... прощаю!',arinaX-4,GY-54,'#b0244a');
    if(t>6.4){ if(t<6.6) heart(arinaX-14,GY-70,3); }
    if(t>7.2) panel([['ПОБЕДА!',11,'#7dff9a'],['Ярик продержался 60 секунд и добежал до Арины',6,'#fff'],t>9?['Тап — в начало',6,'#ffd59a']:['',4]],8);
  }
}
function start(){ resetRun(); requestAnimationFrame(frame); }
</script>
